name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A debug APK to install on a phone for the recognition spike.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: foxaboo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
